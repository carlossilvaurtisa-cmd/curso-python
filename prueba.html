<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba del worker de Pyodide — PyQuest</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #F7F7F7; color: #3C3C3C; }
  h1 { font-size: 20px; }
  pre { background: #1E1E1E; color: #D7FFB8; padding: 16px; border-radius: 12px;
        white-space: pre-wrap; font-size: 13px; }
  .caja { background: #fff; border: 2px solid #E5E5E5; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .ok { color: #58A700; font-weight: 700; }
  .mal { color: #EA2B2B; font-weight: 700; }
</style>
</head>
<body>
<h1>Prueba del worker de Pyodide (código extraído de index.html)</h1>
<div class="caja">
  <div id="estado">Estado: arrancando…</div>
</div>
<div class="caja">
  <div><strong>Programa enviado:</strong></div>
  <pre id="programa"></pre>
</div>
<div class="caja">
  <div><strong>Resultados de las pruebas:</strong></div>
  <pre id="resultados">esperando…</pre>
</div>

<script id="worker-pyodide" type="text/js-worker">

'use strict';
/* ============================================================
   WORKER DE PYODIDE — PyQuest
   Aquí se ejecuta Python de verdad. El hilo principal solo manda
   mensajes y, si el código se pasa de tiempo, mata este worker con
   terminate() sin congelar la pestaña del navegador.
   ============================================================ */

var PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
var pyodide = null;
var matplotlibInstalado = false;
var ejecucionActual = null;

/* Avisa al hilo principal del estado de la carga */
function avisar(estado, detalle, extra) {
  var msg = { tipo: 'estado', estado: estado, detalle: detalle || '' };
  if (extra) { for (var k in extra) { if (Object.prototype.hasOwnProperty.call(extra, k)) msg[k] = extra[k]; } }
  self.postMessage(msg);
}

/* --- 1. CARGA PEREZOSA DE PYODIDE --- */
async function cargar() {
  if (pyodide) { avisar('listo', 'ya cargado'); return; }
  avisar('cargando', 'Descargando el intérprete de Python…');
  try {
    importScripts(PYODIDE_URL + 'pyodide.js');
    pyodide = await loadPyodide({
      indexURL: PYODIDE_URL,
      packages: []
    });
    avisar('cargando', 'Configurando el entorno…');
    pyodide.runPython(
      'import sys, builtins, io, json\n' +
      'sys.setrecursionlimit(220)\n'
    );
    avisar('listo', 'Pyodide ' + pyodide.version + ' listo');
  } catch (err) {
    pyodide = null;
    avisar('error', String(err && err.message ? err.message : err));
  }
}

/* --- 2. PRELUDIO: captura de print(), input() simulado y matplotlib --- */
/* Este código Python se inyecta SIEMPRE antes del código del alumno. */
function construirPreludio(entradas) {
  var json = JSON.stringify(entradas || []);
  return [
    'import sys as _sys, io as _io, builtins as _bi, json as _json',
    'from js import _js_write, _js_write_err, _js_grafico',
    '',
    '# --- Semilla fija de random ---',
    '# Así los ejercicios con números aleatorios dan SIEMPRE el mismo',
    '# resultado (y el alumno puede comprobar su solución). Si el alumno',
    '# llama a random.seed() en su código, su semilla manda.',
    'import random as _random_mod',
    '_random_mod.seed(0)',
    '',
    '# --- Captura de la salida ---',
    '# stdout y stderr van a búferes SEPARADOS: así la salida normal del',
    '# programa no se mezcla con el traceback de un error y las',
    '# validaciones de los ejercicios siguen siendo fiables.',
    '_buf = _io.StringIO()',
    '_buf_err = _io.StringIO()',
    'class _Tee:',
    '    def __init__(self, buffer, aviso):',
    '        self.buffer = buffer',
    '        self.aviso = aviso',
    '    def write(self, s):',
    '        self.buffer.write(s)',
    '        try:',
    '            self.aviso(s)',
    '        except Exception:',
    '            pass',
    '        return len(s)',
    '    def flush(self):',
    '        pass',
    'sys.stdout = _Tee(_buf, _js_write)',
    'sys.stderr = _Tee(_buf_err, _js_write_err)',
    '',
    '# --- input() simulado: usa la lista de entradas del panel de la app ---',
    '_entradas = _json.loads(' + JSON.stringify(json) + ')',
    '_indice_entrada = 0',
    'def _input_simulada(prompt=""):',
    '    global _indice_entrada',
    '    if prompt:',
    '        print(prompt, end="")',
    '    if _indice_entrada < len(_entradas):',
    '        valor = _entradas[_indice_entrada]',
    '        _indice_entrada += 1',
    '        print(valor)',
    '        return valor',
    '    raise EOFError("Tu programa pidio mas datos de los que hay en el panel "',
    '                   "Datos de entrada.")',
    '_bi.input = _input_simulada'
  ].join('\n');
}

/* Instala el "gancho" de matplotlib: convierte cada figura en un PNG
   (base64) y lo manda al hilo principal para pintarlo en el canvas. */
function construirPreludioMatplotlib() {
  return [
    'if not globals().get("_mpl_instalado"):',
    '    try:',
    '        import matplotlib',
    '        matplotlib.use("Agg")',
    '        import matplotlib.pyplot as _plt',
    '        import io as _io2, base64 as _b64',
    '        def _mostrar_figuras(*args, **kwargs):',
    '            for _num in _plt.get_fignums():',
    '                _fig = _plt.figure(_num)',
    '                _b = _io2.BytesIO()',
    '                _fig.savefig(_b, format="png", dpi=110, bbox_inches="tight")',
    '                _imagen_b64 = _b64.b64encode(_b.getvalue()).decode()',
    '                _js_grafico(_imagen_b64)',
    '            _plt.close("all")',
    '        _plt.show = _mostrar_figuras',
    '        _mpl_instalado = True',
    '    except Exception as _e:',
    '        print("Aviso: no se pudo preparar matplotlib:", _e)'
  ].join('\n');
}

/* Se ejecuta después del código del alumno: dibuja los gráficos que
   quedaron pendientes aunque no haya llamado a plt.show(). */
function construirCierre() {
  return [
    'try:',
    '    if "matplotlib.pyplot" in _sys.modules:',
    '        import matplotlib.pyplot as _plt2',
    '        if _plt2.get_fignums():',
    '            _plt2.show()',
    'except Exception:',
    '    pass'
  ].join('\n');
}

/* --- 3. EJECUCIÓN DEL CÓDIGO DEL ALUMNO --- */
async function ejecutar(peticion) {
  var id = peticion.id;
  var codigo = peticion.codigo || '';
  var entradas = peticion.entradas || [];
  var inicio = Date.now();
  ejecucionActual = id;

  if (!pyodide) {
    await cargar();
    if (!pyodide) {
      self.postMessage({
        tipo: 'resultado', id: id, ok: false, salida: '', errorTipo: 'entorno',
        error: 'El intérprete de Python no está disponible.', tiempoMs: 0
      });
      return;
    }
  }

  var usaMatplotlib = /matplotlib/.test(codigo);
  try {
    if (usaMatplotlib && !matplotlibInstalado) {
      avisar('cargando', 'Descargando matplotlib (solo la primera vez)…');
      await pyodide.loadPackage('matplotlib');
      matplotlibInstalado = true;
      avisar('listo', 'matplotlib listo');
    }

    await pyodide.runPythonAsync(construirPreludio(entradas));
    if (usaMatplotlib) {
      await pyodide.runPythonAsync(construirPreludioMatplotlib());
    }

    var fallo = null;
    try {
      await pyodide.runPythonAsync(codigo);
    } catch (err) {
      /* Ojo: err.message vale solo "PythonError". El traceback de verdad está
         en el búfer de errores, porque sys.stderr va al Tee. */
      fallo = String(err && err.message ? err.message : err);
    }

    /* Aunque haya fallado a mitad, intentamos cerrar los gráficos abiertos */
    if (usaMatplotlib) {
      try { await pyodide.runPythonAsync(construirCierre()); } catch (e2) { /* sin importancia */ }
    }

    var salida = '';
    var errores = '';
    try { salida = pyodide.globals.get('_buf').getvalue(); } catch (e3) { salida = ''; }
    try { errores = pyodide.globals.get('_buf_err').getvalue(); } catch (e4) { errores = ''; }

    var huboError = fallo !== null;
    var detalle = errores.trim() || (fallo && fallo !== 'PythonError' ? fallo : '');
    var errorTipo = extraerTipoError(errores) || extraerTipoError(fallo || '');

    self.postMessage({
      tipo: 'resultado',
      id: id,
      ok: !huboError,
      salida: salida,
      error: detalle || (huboError ? 'Error de Python' : ''),
      errorTipo: huboError ? (errorTipo || 'Error') : null,
      tiempoMs: Date.now() - inicio
    });
  } catch (err) {
    self.postMessage({
      tipo: 'resultado', id: id, ok: false, salida: '',
      errorTipo: 'entorno',
      error: 'Fallo interno del intérprete: ' + String(err && err.message ? err.message : err),
      tiempoMs: Date.now() - inicio
    });
  } finally {
    ejecucionActual = null;
  }
}

/* Saca el nombre de la excepción ("NameError", "EOFError", "ValueError"…)
   de la última línea del traceback, que es la informativa. */
function extraerTipoError(texto) {
  var t = String(texto || '');
  if (!t.trim()) return null;

  var lineas = t.split('\n').filter(function (l) { return l.trim() !== ''; });
  for (var i = lineas.length - 1; i >= 0; i--) {
    var coincidencia = lineas[i].match(
      /^\s*([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception|Interrupt|Exit|Warning))\b/);
    if (coincidencia && coincidencia[1] !== 'PythonError') return coincidencia[1];
  }

  /* Si no hay traceback, probamos a buscar cualquier nombre de excepción */
  var suelto = t.match(/\b([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception))\b/);
  return suelto && suelto[1] !== 'PythonError' ? suelto[1] : null;
}

/* --- 4. REINICIAR EL ENTORNO (borra las variables del alumno) --- */
function reiniciarEntorno() {
  if (!pyodide) return;
  pyodide.runPython([
    'import sys as _s3',
    '_conservar = {"__name__", "__doc__", "__package__", "__loader__",',
    '              "__spec__", "__builtins__", "__annotations__"}',
    'for _k in list(globals().keys()):',
    '    if _k not in _conservar and not _k.startswith("_js_"):',
    '        try:',
    '            globals().pop(_k, None)',
    '        except Exception:',
    '            pass'
  ].join('\n'));
}

/* --- 5. PUENTES PYTHON → JAVASCRIPT --- */
function instalarPuentes() {
  var puenteEscritura = function (texto) {
    self.postMessage({ tipo: 'stdout', id: ejecucionActual, texto: String(texto) });
  };
  /* Los errores van por un canal aparte para poder pintarlos en rojo
     y para no ensuciar la salida que comparan las validaciones. */
  var puenteError = function (texto) {
    self.postMessage({ tipo: 'stderr', id: ejecucionActual, texto: String(texto) });
  };
  var puenteGrafico = function (base64) {
    self.postMessage({ tipo: 'grafico', id: ejecucionActual, png: String(base64) });
  };
  self._js_write = puenteEscritura;
  self._js_write_err = puenteError;
  self._js_grafico = puenteGrafico;
}
instalarPuentes();

/* --- 6. BUCLE DE MENSAJES --- */
self.onmessage = async function (evento) {
  var peticion = evento.data || {};
  switch (peticion.tipo) {
    case 'cargar':
      await cargar();
      break;
    case 'ejecutar':
      await ejecutar(peticion);
      break;
    case 'reiniciar':
      reiniciarEntorno();
      self.postMessage({ tipo: 'entorno-reiniciado' });
      break;
    case 'ping':
      self.postMessage({ tipo: 'pong', listo: !!pyodide });
      break;
    default:
      break;
  }
};

/* Puentes usados por el código Python inyectado */
self._js_write = self._js_write || function () {};
self._js_write_err = self._js_write_err || function () {};
self._js_grafico = self._js_grafico || function () {};

avisar('inactivo', 'El intérprete se cargará cuando lo necesites');


</script>

<script>
(function () {
  'use strict';
  var estado = document.getElementById('estado');
  var resultados = document.getElementById('resultados');
  var salida = [];
  var worker = null;

  document.getElementById('programa').textContent = "nombre = input('¿Nombre? ')\nedad = int(input('¿Edad? '))\nprint(f'Hola {nombre}, tienes {edad} años')\nprint('En 10 años tendrás', edad + 10)\nfor i in range(1, 4):\n    print('Línea', i)";

  function anotar(nombre, correcto, detalle) {
    salida.push((correcto ? '✅ ' : '❌ ') + nombre + ' — ' + detalle);
    resultados.textContent = salida.join('\n');
  }

  function crearWorker() {
    var fuente = document.getElementById('worker-pyodide');
    var blob = new Blob([fuente.textContent], { type: 'text/javascript' });
    var url = URL.createObjectURL(blob);
    var w = new Worker(url);
    w.onerror = function (e) {
      anotar('Worker', false, 'error: ' + (e.message || 'desconocido'));
    };
    return w;
  }

  var pendientes = {};
  var contador = 0;
  var graficosRecibidos = 0;

  function ejecutar(codigo, entradas) {
    return new Promise(function (resolver) {
      var id = 'p' + (++contador);
      pendientes[id] = resolver;
      worker.postMessage({ tipo: 'ejecutar', id: id, codigo: codigo, entradas: entradas });
    });
  }

  worker = crearWorker();
  var esperandoCarga = true;

  worker.onmessage = function (evento) {
    var m = evento.data || {};

    if (m.tipo === 'estado') {
      estado.textContent = 'Estado: ' + m.estado + (m.detalle ? ' — ' + m.detalle : '');
      if (m.estado === 'listo' && esperandoCarga) {
        esperandoCarga = false;
        anotar('Pyodide cargado en el worker', true, m.detalle || 'listo');
        lanzarPruebas();
      }
      if (m.estado === 'error') {
        anotar('Pyodide cargado en el worker', false, m.detalle || 'error');
        estado.textContent = 'Estado: error';
      }
      return;
    }

    if (m.tipo === 'stdout') return;   // la salida completa llega en 'resultado'
    if (m.tipo === 'stderr') return;

    if (m.tipo === 'grafico') { graficosRecibidos += 1; return; }

    if (m.tipo === 'resultado' && pendientes[m.id]) {
      pendientes[m.id](m);
      delete pendientes[m.id];
    }
  };

  function lanzarPruebas() {
    ejecutar("nombre = input('¿Nombre? ')\nedad = int(input('¿Edad? '))\nprint(f'Hola {nombre}, tienes {edad} años')\nprint('En 10 años tendrás', edad + 10)\nfor i in range(1, 4):\n    print('Línea', i)", ['Ana', '25']).then(function (r) {
      var esperado = '¿Nombre? Ana\n¿Edad? 25\nHola Ana, tienes 25 años\n' +
        'En 10 años tendrás 35\nLínea 1\nLínea 2\nLínea 3\n';
      anotar('El programa se ejecuta sin error', r.ok === true,
        r.ok ? 'ok, ' + r.tiempoMs + ' ms' : 'error: ' + (r.error || '').split('\n')[0]);
      anotar('input() simulado devuelve los datos', (r.salida || '').indexOf('¿Nombre? Ana') !== -1,
        'salida contiene "¿Nombre? Ana"');
      anotar('f-strings y aritmética', (r.salida || '').indexOf('tienes 25 años') !== -1 &&
        (r.salida || '').indexOf('tendrás 35') !== -1, 'contenido correcto');
      anotar('Bucle for', (r.salida || '').indexOf('Línea 3') !== -1, 'llegó a la tercera vuelta');
      anotar('La salida coincide EXACTAMENTE con la esperada', r.salida === esperado,
        r.salida === esperado ? 'coincide carácter a carácter' :
        'diferencia:\n--- obtenido ---\n' + JSON.stringify(r.salida) +
        '\n--- esperado ---\n' + JSON.stringify(esperado));

      return ejecutar('print(no_definida)', []);
    }).then(function (r) {
      anotar('NameError detectado', r.ok === false && r.errorTipo === 'NameError',
        'errorTipo=' + r.errorTipo);
      anotar('El traceback NO ensucia la salida del programa',
        (r.salida || '').trim() === '', 'salida=' + JSON.stringify(r.salida || ''));
      anotar('El traceback llega como detalle técnico',
        (r.error || '').indexOf('NameError') !== -1, 'error contiene "NameError"');
      return ejecutar("x = input('dato: ')", []);
    }).then(function (r) {
      anotar('EOFError detectado (faltan datos)', r.ok === false && r.errorTipo === 'EOFError',
        'errorTipo=' + r.errorTipo);
      return ejecutar("import random\nprint(random.randint(1, 20))", []);
    }).then(function (r) {
      anotar('random sembrado: randint(1,20) = 13', (r.salida || '').trim() === '13',
        'salida="' + (r.salida || '').trim() + '"');
      return ejecutar("import random\nprint(random.randint(1, 100))", []);
    }).then(function (r) {
      anotar('random sembrado: randint(1,100) = 50', (r.salida || '').trim() === '50',
        'salida="' + (r.salida || '').trim() + '"');

      /* matplotlib: es la ruta más pesada (descarga otro paquete) */
      estado.textContent = 'Estado: probando matplotlib…';
      return ejecutar("import matplotlib.pyplot as plt\n" +
        "plt.plot([1, 2, 3], [1, 4, 9])\n" +
        "plt.title('Prueba de gráfico')\n" +
        "plt.show()", []);
    }).then(function (r) {
      anotar('matplotlib se ejecuta sin error', r.ok === true,
        r.ok ? 'ok, ' + r.tiempoMs + ' ms'
             : 'errorTipo=' + r.errorTipo + '\n' + String(r.error || '').slice(-1200));
      return new Promise(function (res) { setTimeout(res, 1200); });
    }).then(function () {
      anotar('matplotlib entrega la imagen al canvas', graficosRecibidos >= 1,
        graficosRecibidos + ' imagen(es) PNG recibidas');

      var fallos = salida.filter(function (l) { return l.indexOf('❌') === 0; }).length;
      estado.innerHTML = fallos === 0
        ? '<span class="ok">TODO CORRECTO (' + salida.length + ' pruebas)</span>'
        : '<span class="mal">' + fallos + ' prueba(s) fallidas de ' + salida.length + '</span>';
      document.title = 'PRUEBA ' + (fallos === 0 ? 'OK' : 'CON FALLOS');
    });
  }

  worker.postMessage({ tipo: 'cargar' });
})();
</script>
</body>
</html>
